name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/sync.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check worker/src/index.js && node --check worker/scripts/hash-sync-password.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build
