name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN }}
          SYNC_PASSWORD: ${{ secrets.SYNC_PASSWORD }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$SYNC_GITHUB_TOKEN" || { echo "Missing SYNC_GITHUB_TOKEN"; exit 1; }
          test -n "$SYNC_PASSWORD" || { echo "Missing SYNC_PASSWORD"; exit 1; }
      - name: Hash sync password
        id: password
        env:
          SYNC_PASSWORD: ${{ secrets.SYNC_PASSWORD }}
        run: node worker/scripts/hash-sync-password.mjs
      - name: Deploy Worker and set runtime secrets
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            GITHUB_TOKEN
            SYNC_PASSWORD_HASH
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN }}
          SYNC_PASSWORD_HASH: ${{ steps.password.outputs.hash }}
      - name: Verify deployed sync credential without changing data
        env:
          SYNC_PASSWORD: ${{ secrets.SYNC_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://h-tools-sync.tsai97216.workers.dev/api/sync';
          let lastCode = 'NO_RESPONSE';
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  origin: 'https://h.chi.qzz.io',
                },
                body: JSON.stringify({ action: 'check-auth', password: process.env.SYNC_PASSWORD.trim() }),
              });
              const result = await response.json().catch(() => ({}));
              if (response.ok && result.ok === true) {
                console.log('Sync credential self-check passed.');
                process.exit(0);
              }
              lastCode = result.error || String(response.status);
            } catch (error) {
              lastCode = error instanceof Error ? error.name : 'NETWORK_ERROR';
            }
            if (attempt < 5) await new Promise((resolve) => setTimeout(resolve, 2000));
          }
          console.error('Sync credential self-check failed: ' + lastCode);
          process.exit(1);
          NODE
